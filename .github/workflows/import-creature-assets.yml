name: Import NULL FLOOR creature assets

on:
  push:
    paths:
      - '.asset-import/READY'

permissions:
  contents: write

jobs:
  import-creatures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate optimized GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/creatures
          cat .asset-import/v22h10.*.b64 | base64 --decode | xz -dc > public/assets/creatures/pale_hunter.glb
          cat .asset-import/v22s10.*.b64 | base64 --decode | xz -dc > public/assets/creatures/smily_horror_monster.glb
          python - <<'PY'
          import json, struct, hashlib
          from pathlib import Path

          expected = {
            'public/assets/creatures/pale_hunter.glb': {
              'sha256': 'ca252c885c65f1d5cd6f232d99c5ce2f2a0688d261d25c5c6eda677335e949da',
              'size': 601280,
              'animations': {
                'scp096_skeleton|attackjump',
                'scp096_skeleton|idle2',
                'scp096_skeleton|idle3lookaround',
                'scp096_skeleton|panic',
                'scp096_skeleton|running',
                'scp096_skeleton|walk2',
              },
            },
            'public/assets/creatures/smily_horror_monster.glb': {
              'sha256': '743b75440873b3683e769a08ca87cacccb5fff1133f0aa1306daf48c9e8f22a1',
              'size': 687284,
              'animations': {'Armature|ArmatureAction'},
            },
          }

          for filename, want in expected.items():
            data = Path(filename).read_bytes()
            if data[:4] != b'glTF': raise SystemExit(f'{filename}: invalid GLB magic')
            if len(data) != want['size']: raise SystemExit(f'{filename}: unexpected size {len(data)}')
            if hashlib.sha256(data).hexdigest() != want['sha256']: raise SystemExit(f'{filename}: hash mismatch')
            _, version, total = struct.unpack_from('<4sII', data, 0)
            if version != 2 or total != len(data): raise SystemExit(f'{filename}: invalid GLB header')
            chunk_len, chunk_type = struct.unpack_from('<II', data, 12)
            if chunk_type != 0x4E4F534A: raise SystemExit(f'{filename}: missing JSON chunk')
            doc = json.loads(data[20:20+chunk_len].decode('utf-8').rstrip('\x00 '))
            if len(doc.get('skins', [])) < 1: raise SystemExit(f'{filename}: rig missing')
            if not doc.get('images'): raise SystemExit(f'{filename}: embedded textures missing')
            clips = {a.get('name','') for a in doc.get('animations', [])}
            missing = want['animations'] - clips
            if missing: raise SystemExit(f'{filename}: missing animations {sorted(missing)}')
            print(filename, len(data), 'bytes', len(clips), 'animations', hashlib.sha256(data).hexdigest())
          PY
          node --check src/main.js

      - name: Commit creature binaries to finalize branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/creatures .asset-import
          git commit -m "assets: add optimized rigged horror creatures"
          git push origin HEAD:v2.2-binary-finalize
