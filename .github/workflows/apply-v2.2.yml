name: Apply NULL FLOOR v2.2 creature integration

on:
  push:
    paths:
      - 'patches/v2.2.READY'

permissions:
  contents: write

jobs:
  apply-v22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate creature integration patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patches/v2.2-creatures.patch
          git apply patches/v2.2-creatures.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          needle = "populatePolyHavenDecor();\nrecorded.init();"
          repl = "populatePolyHavenDecor();\nrecorded.init();\nloadCreatureModels();"
          if 'loadCreatureModels();' not in s[s.rfind('// Initial async art pass.'):]:
              if needle not in s:
                  raise SystemExit('Could not locate initial art-pass hook')
              s = s.replace(needle, repl, 1)
              p.write_text(s)
          PY
          node --check src/main.js

      - name: Commit v2.2 creature integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "feat: integrate rigged hunter and Smiler creature systems"
          git pull --rebase origin main
          git push origin HEAD:main
