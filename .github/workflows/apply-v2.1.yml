name: Apply NULL FLOOR v2.1 gameplay patch

on:
  push:
    paths:
      - 'patches/v2.1.patch.zb64'

permissions:
  contents: write

jobs:
  apply-v21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path('patches/v2.1.patch.zb64').read_text().strip()
          Path('/tmp/v2.1.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          git apply --check /tmp/v2.1.patch
          git apply /tmp/v2.1.patch
          node --check src/main.js

      - name: Commit v2.1 gameplay patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "feat: add interactive rooms, door logic, melee tool, threat drone and decor polish"
          git push origin HEAD:main
